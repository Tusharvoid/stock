<!DOCTYPE html>
<html>
<head>
    <title>Test Backend API</title>
</head>
<body>
    <h2>Test User Registration and Login</h2>
    
    <div>
        <h3>Register User</h3>
        <input type="email" id="registerEmail" placeholder="Email" value="test@example.com">
        <input type="password" id="registerPassword" placeholder="Password" value="testpass123">
        <button onclick="registerUser()">Register</button>
        <div id="registerResult"></div>
    </div>

    <div>
        <h3>Login User</h3>
        <input type="email" id="loginEmail" placeholder="Email" value="test@example.com">
        <input type="password" id="loginPassword" placeholder="Password" value="testpass123">
        <button onclick="loginUser()">Login</button>
        <div id="loginResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function registerUser() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                document.getElementById('registerResult').innerHTML = 
                    `Status: ${response.status}<br>Response: ${JSON.stringify(result)}`;
            } catch (error) {
                document.getElementById('registerResult').innerHTML = 
                    `Error: ${error.message}`;
            }
        }

        async function loginUser() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                document.getElementById('loginResult').innerHTML = 
                    `Status: ${response.status}<br>Response: ${JSON.stringify(result)}`;
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
